function GymPlanInner() {
  const [page, setPage] = useState("workout");
  const [selectedDay, setSelectedDay] = useState(0);
  const [data, setData] = useState(loadData);
  const dateKey = getDateKey(new Date());
  const todayLabel = new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  // update() takes an object patch (same call sites as before, nothing
  // changes for callers) but merges it against the LATEST state via
  // React's functional setState form instead of the `data` closure
  // variable. That closure goes stale the instant a handler calls update()
  // more than once before a re-render happens - which is exactly what
  // logging a nutrition entry that also crosses an XP threshold did: the
  // XP award's own update() call would merge its {xp, xpLog} patch on top
  // of the OLD data, silently reverting the entry (or checkbox, or Flex
  // Day toggle) the first update() call had just set. Same root cause hit
  // workout-day completion and Flex Day completion too, not just nutrition.
  function update(patch) {
    setData(prev => {
      const updated = { ...prev, ...patch };
      saveData(updated);
      return updated;
    });
  }

  // Persist once on mount so a freshly-defaulted programStartDate (used for
  // the deload-week cadence) actually gets written to storage even if
  // nothing else changes this session.
  useEffect(() => { saveData(data); }, []);

  const [toasts, setToasts] = useState([]);
  function pushToast(title, subtitle, color) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, title, subtitle, color }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }

  // Pure helper: given current xp/xpLog, try to award once per reasonKey.
  // Returns updated xp/xpLog plus whether it was newly awarded, without touching state.
  function tryAwardXp(xp, xpLog, reasonKey, amount) {
    if (xpLog[reasonKey]) return { xp, xpLog, gained: false };
    return { xp: xp + amount, xpLog: { ...xpLog, [reasonKey]: true }, gained: true };
  }

  // Applies a list of {reasonKey, amount, label, color} awards as ONE combined
  // state update, so multiple simultaneous awards (e.g. hitting all 4 macros
  // at once) stack correctly instead of clobbering each other.
  function applyXpAwards(awards) {
    let xp = data.xp;
    let xpLog = data.xpLog;
    const toastQueue = [];
    for (const a of awards) {
      const result = tryAwardXp(xp, xpLog, a.reasonKey, a.amount);
      xp = result.xp;
      xpLog = result.xpLog;
      if (result.gained) toastQueue.push(a);
    }
    if (toastQueue.length) {
      update({ xp, xpLog });
      toastQueue.forEach(a => pushToast(`+${a.amount} XP`, a.label, a.color));
    }
  }

  function handleWeightChange(key, value) { update({ weights: { ...data.weights, [key]: value } }); }
  function handleLogHistory(key, entry) {
    const existing = data.exerciseHistory[key] || [];
    update({ exerciseHistory: { ...data.exerciseHistory, [key]: [...existing, entry].slice(-12) } });
  }
  function handleMaxSave(maxes) { update({ maxes }); }
  function handleSetEffort(sessionKey, effort) {
    const existing = data.sessionLog[sessionKey];
    if (!existing) return;
    update({ sessionLog: { ...data.sessionLog, [sessionKey]: { ...existing, effort } } });
  }
  function handleLogActivity(entry) {
    update({ activityLog: [...(data.activityLog || []), entry] });
  }
  function handleDeleteActivity(index) {
    update({ activityLog: (data.activityLog || []).filter((_, i) => i !== index) });
  }
  function handleDifficultyChange(key, value) { update({ difficulty: { ...data.difficulty, [key]: value } }); }
  function handleMissedToggle(key) {
    const updated = { ...data.missed };
    if (updated[key]) delete updated[key]; else updated[key] = true;
    update({ missed: updated });
  }
  function handleCoreToggle(key) {
    const updated = { ...data.coreSkip };
    if (updated[key]) delete updated[key]; else updated[key] = true;
    update({ coreSkip: updated });
  }
  function handleSetCoreMode(key, mode) {
    update({ coreMode: { ...data.coreMode, [key]: mode } });
  }

  function handleStartWorkout(dayId) {
    const dateKey = getDateKey(new Date());
    update({ activeSession: { dateKey, dayId, start: new Date().toISOString() } });
  }

  function handleJumpToDay(dayId) {
    const idx = days.findIndex(d => d.id === dayId);
    if (idx >= 0) setSelectedDay(idx);
    setPage("workout");
  }

  function handleFlexCheckToggle(kind, name) {
    const dateKey = getDateKey(new Date());
    const key = kind === "cardio" ? `${dateKey}_flex_cardio` : `${dateKey}_flex_core_${name.replace(/\s+/g, "_")}`;
    const updated = { ...data.checks };
    const wasChecked = !!updated[key];
    if (wasChecked) delete updated[key]; else updated[key] = true;
    update({ checks: updated });

    if (!wasChecked) {
      const requiredKeys = [
        ...coreExercisesRegular.map(e => `${dateKey}_flex_core_${e.name.replace(/\s+/g, "_")}`),
        `${dateKey}_flex_cardio`,
      ];
      const allChecked = requiredKeys.every(k => updated[k]);
      if (allChecked) {
        pushToast("Flex day complete!", "Nice work keeping the streak going.", "#38bdf8");
        applyXpAwards([{ reasonKey: `xp_flex_${dateKey}`, amount: 15, label: "Flex day session", color: "#38bdf8" }]);
      }
    }
  }

  function buildCheckKey(dateKey, dayId, kind, name) {
    if (kind === "cardio") return `${dateKey}_d${dayId}_cardio`;
    if (kind === "core") return `${dateKey}_d${dayId}_core_${name.replace(/\s+/g, "_")}`;
    if (kind === "corefinisher") return `${dateKey}_d${dayId}_corefinisher_${name.replace(/\s+/g, "_")}`;
    return `${dateKey}_d${dayId}_${name.replace(/\s+/g, "_")}`;
  }

  function handleSetsRepsChange(baseKey, val) {
    update({ customSetsReps: { ...data.customSetsReps, [baseKey]: val } });
  }

  function handleCheckToggle(dayId, exerciseName, dayLabel, kind = "lift") {
    const dateKey = getDateKey(new Date());
    const key = buildCheckKey(dateKey, dayId, kind, exerciseName);
    const updated = { ...data.checks };
    const wasChecked = !!updated[key];
    if (wasChecked) delete updated[key]; else updated[key] = true;
    update({ checks: updated });

    if (!wasChecked) {
      // Just checked this one, see if that completes the whole day
      // (lift exercises + core, unless skipped, + cardio all need to be checked)
      const dayDef = days.find(d => d.id === dayId);
      if (dayDef && dayDef.sections) {
        const liftNames = dayDef.sections.flatMap(s => s.exercises.map(e => e.name));
        const coreSkipped = !!data.coreSkip[`${dateKey}_d${dayId}`];
        const coreModeVal = data.coreMode[`${dateKey}_d${dayId}`] || "regular";
        const coreNames = coreSkipped ? [] : (coreModeVal === "full" ? coreExercisesFull : coreExercisesRegular).map(e => e.name);
        const finisherNames = dayDef.coreFinisher ? coreFinisherExercises.map(e => e.name) : [];

        const requiredKeys = [
          ...liftNames.map(n => buildCheckKey(dateKey, dayId, "lift", n)),
          ...coreNames.map(n => buildCheckKey(dateKey, dayId, "core", n)),
          ...finisherNames.map(n => buildCheckKey(dateKey, dayId, "corefinisher", n)),
          buildCheckKey(dateKey, dayId, "cardio", null),
        ];
        const allChecked = requiredKeys.every(k => updated[k]);
        if (allChecked) {
          const weight = data.weightLog[data.weightLog.length - 1]?.weight;
          const session = data.activeSession;
          const usingRealTime = session && session.dateKey === dateKey && session.dayId === dayId;

          let durationMin = null;
          let cals;
          if (usingRealTime) {
            const start = new Date(session.start);
            const end = new Date();
            durationMin = Math.max(1, Math.round((end - start) / 60000));
            cals = estimateCaloriesBurned(weight, durationMin / 60);
          } else {
            cals = estimateCaloriesBurned(weight);
          }

          const sessionKey = `${dateKey}_d${dayId}`;
          const newSessionLog = {
            ...data.sessionLog,
            [sessionKey]: { dateKey, dayId, dayTitle: dayLabel, durationMin, calories: cals, loggedAt: new Date().toISOString() },
          };
          update({ sessionLog: newSessionLog, activeSession: null });

          pushToast(
            `Workout complete! 🔥`,
            durationMin ? `${durationMin} min · ~${cals} calories burned` : `~${cals} calories burned (estimate)`,
            "#10b981"
          );
          applyXpAwards([{ reasonKey: `xp_workout_${dateKey}_d${dayId}`, amount: 30, label: `${dayLabel} complete`, color: "#10b981" }]);
        }
      }
    }
  }

  function handleAddNutritionEntry(dateKey, entry) {
    const updated = { ...data.nutritionLog };
    updated[dateKey] = [...(updated[dateKey] || []), entry];
    update({ nutritionLog: updated });

    // Recompute totals against today's targets and award XP for newly-hit macros
    const latestWeight = data.weightLog[data.weightLog.length - 1]?.weight;
    const isRestDay = new Date().getDay() === 0;
    const targets = getDietTargets(latestWeight || 200, isRestDay);
    if (!targets) return;
    const totals = sumEntries(updated[dateKey]);
    const hits = checkMacroHits(totals, targets);

    const awards = [];
    if (hits.calories) awards.push({ reasonKey: `xp_cal_${dateKey}`, amount: 5, label: "Calorie target hit", color: "#f59e0b" });
    if (hits.protein) awards.push({ reasonKey: `xp_protein_${dateKey}`, amount: 5, label: "Protein target hit", color: "#10b981" });
    if (hits.carbs) awards.push({ reasonKey: `xp_carbs_${dateKey}`, amount: 5, label: "Carb target hit", color: "#38bdf8" });
    if (hits.fat) awards.push({ reasonKey: `xp_fat_${dateKey}`, amount: 5, label: "Fat target hit", color: "#f59e0b" });
    if (hits.fiber) awards.push({ reasonKey: `xp_fiber_${dateKey}`, amount: 5, label: "Fiber target hit", color: "#84cc16" });
    if (hits.water) awards.push({ reasonKey: `xp_water_${dateKey}`, amount: 5, label: "Water target hit", color: "#8b5cf6" });
    // Original four macros still gate the bonus. Sodium is deliberately left
    // out: it's a ceiling you can satisfy by simply not eating, so rewarding
    // it would push the wrong direction.
    if (hits.calories && hits.protein && hits.fat && hits.water) {
      awards.push({ reasonKey: `xp_allmacros_${dateKey}`, amount: 10, label: "All macros hit today! 🎯", color: "#a855f7" });
    }
    applyXpAwards(awards);
  }

  function handleDeleteNutritionEntry(dateKey, index) {
    const updated = { ...data.nutritionLog };
    updated[dateKey] = (updated[dateKey] || []).filter((_, i) => i !== index);
    update({ nutritionLog: updated });
  }

  const today = new Date().getDay();
  const dayMap = [6, 0, 1, 2, 3, 4, 5];
  const todayIdx = dayMap[today];
  const day = days[selectedDay];
  const zones = getHRZones(data.profile.age);

  const weekKeyNow = getWeekKey(new Date());
  const weeksSinceStart = Math.floor((new Date() - new Date(data.programStartDate)) / (7 * 24 * 60 * 60 * 1000));
  const deloadDue = weeksSinceStart > 0 && weeksSinceStart % 6 === 0 && data.deloadAckWeek !== weekKeyNow;
  function handleAckDeload() { update({ deloadAckWeek: weekKeyNow }); }

  const navItems = [
    { key: "nutrition", label: "Nutrition" },
    { key: "workout", label: "Workout" },
    { key: "maxes", label: "5RM" },
    { key: "profile", label: "Progress" },
    { key: "results", label: "Results" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#030712", fontFamily: "'Inter', sans-serif" }}>
      <ToastStack toasts={toasts} />
      <div style={{ background: "#030712", borderBottom: "1px solid #111827", padding: "20px 20px 0" }}>
        <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "4px", marginBottom: "2px" }}>ROBERT'S</div>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "12px" }}>
          <div style={{ color: "#f9fafb", fontSize: "24px", fontWeight: "800", letterSpacing: "-0.5px" }}>Gym Plan</div>
          <div style={{ color: "#6b7280", fontSize: "11px", fontWeight: "700", background: "#111827", border: "1px solid #1f2937", borderRadius: "6px", padding: "3px 8px" }}>{APP_VERSION}</div>
          <div style={{ color: "#374151", fontSize: "11px", fontWeight: "600", marginLeft: "auto" }}>{todayLabel}</div>
        </div>
        <div style={{ display: "flex", gap: "6px", marginBottom: "16px" }}>
          {navItems.map(n => (
            <button key={n.key} onClick={() => setPage(n.key)} style={{ background: page === n.key ? "#f9fafb" : "#111827", color: page === n.key ? "#030712" : "#6b7280", border: "none", borderRadius: "8px", padding: "8px 16px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>
              {n.label}
            </button>
          ))}
        </div>
        {page === "workout" && (
          <div style={{ display: "flex", gap: "6px", overflowX: "auto", paddingBottom: "16px" }}>
            {days.map((d, i) => {
              const isToday = i === todayIdx;
              const isSelected = selectedDay === i;
              const weekKey = getWeekKey(new Date());
              const isMissed = !!data.missed[`${weekKey}_d${d.id}`];
              return (
                <button key={d.id} onClick={() => setSelectedDay(i)} style={{
                  background: isSelected ? "#f9fafb" : isToday ? "#1e3a5f" : "#111827",
                  color: isSelected ? "#030712" : isToday ? "#38bdf8" : "#6b7280",
                  border: isMissed ? "1px solid #ef4444" : (isToday && !isSelected ? "1px solid #38bdf8" : "none"),
                  borderRadius: "8px", padding: "8px 14px", fontSize: "12px", fontWeight: "700",
                  cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0, opacity: d.rest ? 0.5 : 1,
                }}>
                  {d.label}
                  {isToday && !isSelected && <span style={{ display: "block", fontSize: "8px", marginTop: "1px", letterSpacing: "1px" }}>TODAY</span>}
                  {d.rest && <span style={{ display: "block", fontSize: "8px", marginTop: "1px" }}>REST</span>}
                  {isMissed && <span style={{ display: "block", fontSize: "8px", marginTop: "1px", color: "#ef4444" }}>MISSED</span>}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {page === "workout" && deloadDue && (
        <div style={{ margin: "16px 20px 0", background: "#78350f22", border: "1px solid #f59e0b55", borderRadius: "12px", padding: "14px 16px" }}>
          <div style={{ color: "#f59e0b", fontSize: "10px", letterSpacing: "3px", marginBottom: "6px" }}>DELOAD WEEK SUGGESTED</div>
          <div style={{ color: "#f9fafb", fontSize: "13px", lineHeight: "1.5", marginBottom: "10px" }}>About 6 weeks of training since your last reset. Drop weight roughly 15%, keep the same reps, let your joints catch up. Normal weight comes back next week.</div>
          <button onClick={handleAckDeload} style={{ background: "#f59e0b", color: "#030712", border: "none", borderRadius: "8px", padding: "8px 14px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>Got it</button>
        </div>
      )}

      {page === "profile" ? (
        <ProfilePage data={data} onUpdate={update} />
      ) : page === "maxes" ? (
        <MaxTracker maxes={data.maxes} onSave={handleMaxSave} />
      ) : page === "nutrition" ? (
        <NutritionPage nutritionLog={data.nutritionLog} latestWeight={data.weightLog[data.weightLog.length - 1]?.weight} onAddEntry={handleAddNutritionEntry} onDeleteEntry={handleDeleteNutritionEntry} />
      ) : page === "results" ? (
        <ResultsPage sessionLog={data.sessionLog} activityLog={data.activityLog} weight={data.weightLog[data.weightLog.length - 1]?.weight} onSetEffort={handleSetEffort} onLogActivity={handleLogActivity} onDeleteActivity={handleDeleteActivity} />
      ) : day.flex ? (
        <FlexDayPage data={data} weights={data.weights} exerciseHistory={data.exerciseHistory} onJumpToDay={handleJumpToDay} onJumpToMaxes={() => setPage("maxes")} onToggleFlexCheck={handleFlexCheckToggle} onWeightChange={handleWeightChange} onLogHistory={handleLogHistory} zones={zones} />
      ) : (
        <div style={{ padding: "20px" }}>
          <div style={{ color: "#f9fafb", fontSize: "20px", fontWeight: "800", marginBottom: "2px" }}>{day.title}</div>
          <div style={{ color: "#6b7280", fontSize: "13px", marginBottom: day.note ? "6px" : "20px" }}>Stretch · Lift · Core · Cardio</div>
          {day.note && <div style={{ color: "#f59e0b", fontSize: "12px", marginBottom: "20px", fontWeight: "600" }}>{day.note}</div>}

          <MissedDayButton dayId={day.id} missed={data.missed} onToggle={handleMissedToggle} />
          <StartWorkoutBanner dayId={day.id} activeSession={data.activeSession} onStart={() => handleStartWorkout(day.id)} />
          <StretchSection dayTitle={day.title} stretchKey={day.stretchKey} />

          {day.sections.map(section => (
            <div key={section.name} style={{ marginBottom: "24px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "12px" }}>
                <div style={{ width: "3px", height: "18px", background: section.color, borderRadius: "2px" }} />
                <div style={{ color: section.color, fontSize: "11px", letterSpacing: "3px", fontWeight: "700" }}>{section.name}</div>
              </div>
              {section.exercises.map(ex => {
                const checkKey = `${dateKey}_d${day.id}_${ex.name.replace(/\s+/g, "_")}`;
                return (
                  <ExerciseCard key={ex.name} exercise={ex} sectionColor={section.color} dayId={day.id} weights={data.weights} maxes={data.maxes} difficulty={data.difficulty} customSetsReps={data.customSetsReps} exerciseHistory={data.exerciseHistory} onWeightChange={handleWeightChange} onLogHistory={handleLogHistory} onDifficultyChange={handleDifficultyChange} onSetsRepsChange={handleSetsRepsChange} checked={!!data.checks[checkKey]} onToggleCheck={() => handleCheckToggle(day.id, ex.name, day.title, "lift")} />
                );
              })}
            </div>
          ))}

          <div style={{ marginBottom: "24px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", marginBottom: "12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <div style={{ width: "3px", height: "18px", background: "#ec4899", borderRadius: "2px" }} />
                <div style={{ color: "#ec4899", fontSize: "11px", letterSpacing: "3px", fontWeight: "700" }}>CORE</div>
              </div>
              <div style={{ display: "flex", gap: "6px" }}>
                <CoreModeToggle dayId={day.id} coreMode={data.coreMode} onSetMode={handleSetCoreMode} />
                <CoreToggle dayId={day.id} coreSkip={data.coreSkip} onToggle={handleCoreToggle} />
              </div>
            </div>
            {!!data.coreSkip[`${dateKey}_d${day.id}`] ? (
              <div style={{ color: "#6b7280", fontSize: "12px", padding: "10px 0" }}>Core skipped today.</div>
            ) : (
              ((data.coreMode[`${dateKey}_d${day.id}`] || "regular") === "full" ? coreExercisesFull : coreExercisesRegular)
                .map(ex => {
                  const coreCheckKey = `${dateKey}_d${day.id}_core_${ex.name.replace(/\s+/g, "_")}`;
                  return <CoreCard key={ex.name} exercise={ex} dayId={day.id} weights={data.weights} exerciseHistory={data.exerciseHistory} onWeightChange={handleWeightChange} onLogHistory={handleLogHistory} checked={!!data.checks[coreCheckKey]} onToggleCheck={() => handleCheckToggle(day.id, ex.name, day.title, "core")} />;
                })
            )}
          </div>

          {day.coreFinisher && (
            <div style={{ marginBottom: "24px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "6px" }}>
                <div style={{ width: "3px", height: "18px", background: "#f97316", borderRadius: "2px" }} />
                <div style={{ color: "#f97316", fontSize: "11px", letterSpacing: "3px", fontWeight: "700" }}>CORE FINISHER</div>
              </div>
              <div style={{ color: "#6b7280", fontSize: "12px", marginBottom: "12px" }}>Your bigger core session for the week, on top of the regular block above.</div>
              {coreFinisherExercises.map(ex => {
                const finisherCheckKey = `${dateKey}_d${day.id}_corefinisher_${ex.name.replace(/\s+/g, "_")}`;
                return <CoreCard key={ex.name} exercise={ex} dayId={day.id} keyPrefix="corefinisher" colorOverride="#f97316" weights={data.weights} exerciseHistory={data.exerciseHistory} onWeightChange={handleWeightChange} onLogHistory={handleLogHistory} checked={!!data.checks[finisherCheckKey]} onToggleCheck={() => handleCheckToggle(day.id, ex.name, day.title, "corefinisher")} />;
              })}
            </div>
          )}

          <CardioBanner zones={zones} dayId={day.id} checked={!!data.checks[`${dateKey}_d${day.id}_cardio`]} onToggleCheck={() => handleCheckToggle(day.id, null, day.title, "cardio")} />

          <div style={{ background: "#0d1117", borderRadius: "12px", padding: "14px 16px", border: "1px solid #1f2937" }}>
            <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "3px", marginBottom: "6px" }}>WEIGHT TIP</div>
            <div style={{ color: "#9ca3af", fontSize: "13px", lineHeight: "1.6" }}>Reps 12-15 should feel hard but controlled. If the last rep is easy, go up 5 lbs next set.</div>
          </div>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  handleReset = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    this.setState({ error: null });
    window.location.reload();
  };
  render() {
    if (this.state.error) {
      return (
        <div style={{ background: "#030712", minHeight: "100vh", padding: "24px", color: "#f9fafb", fontFamily: "monospace" }}>
          <div style={{ color: "#ef4444", fontSize: "16px", fontWeight: "800", marginBottom: "12px" }}>App crashed on load</div>
          <div style={{ color: "#9ca3af", fontSize: "12px", marginBottom: "16px", lineHeight: "1.6", whiteSpace: "pre-wrap" }}>
            {this.state.error?.message || String(this.state.error)}
          </div>
          <div style={{ color: "#6b7280", fontSize: "11px", marginBottom: "20px" }}>
            Screenshot this and send it back. Your saved data is still intact, this button below only clears it if you choose to.
          </div>
          <button onClick={this.handleReset} style={{
            background: "#ef444422", color: "#ef4444", border: "1px solid #ef444455",
            borderRadius: "10px", padding: "12px 20px", fontSize: "13px", fontWeight: "700", cursor: "pointer",
          }}>
            Reset app data and reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

export default function GymPlan() {
  return (
    <ErrorBoundary>
      <GymPlanInner />
    </ErrorBoundary>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GymPlan />);
</script>
</body>
