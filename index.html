// ============================================================================
// DATA LAYER

const APP_VERSION = "v20";

// Storage key is intentionally NOT tied to APP_VERSION.
// Bumping the version must never wipe the weight log, 5RMs, or logged weights.
const STORAGE_KEY = "roberts_gym_v5";

// v16 nutrition entry schema:
//   { name, grams, calories, protein, carbs, fat, fiber, sodium, water }
//
// Pre-v16 entries were { label, calories, protein, fat, water }. This migrates
// them in place under the SAME storage key so no logged history is orphaned.
// It is idempotent: entries already carrying a `name` are left untouched, so
// it's safe to run on every load. `water` is kept beyond the spec'd field list
// because the Water target bar still depends on it.
function migrateNutritionEntry(e) {
  if (!e || typeof e !== "object") return e;
  if (e.name !== undefined && e.grams !== undefined) return e; // already v16
  return {
    name: e.name !== undefined ? e.name : (e.label || "Entry"),
    grams: e.grams != null ? e.grams : null,
    calories: e.calories || 0,
    protein: e.protein || 0,
    carbs: e.carbs || 0,
    fat: e.fat || 0,
    fiber: e.fiber || 0,
    sodium: e.sodium || 0,
    water: e.water || 0,
  };
}

function migrateNutritionLog(log) {
  if (!log || typeof log !== "object") return {};
  const out = {};
  for (const dateKey of Object.keys(log)) {
    const entries = log[dateKey];
    out[dateKey] = Array.isArray(entries) ? entries.map(migrateNutritionEntry) : [];
  }
  return out;
}

function loadData() {
  const defaults = {
    weights: {}, maxes: {}, missed: {}, difficulty: {}, coreSkip: {}, quickCoreLog: {},
    checks: {}, nutritionLog: {}, xp: 0, xpLog: {}, coreMode: {}, customSetsReps: {},
    exerciseHistory: {}, deloadAckWeek: null, programStartDate: new Date().toISOString(),
    activeSession: null, sessionLog: {}, activityLog: [],
    profile: { age: 31, goalWeight: 180 },
    weightLog: [{ date: "Jul 2025", weight: 206.6 }],
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const merged = { ...defaults, ...saved, profile: { ...defaults.profile, ...(saved.profile || {}) } };
      merged.nutritionLog = migrateNutritionLog(merged.nutritionLog);
      merged.maxes = migrateMaxes(merged.maxes);
      return merged;
    }
  } catch {}
  return defaults;
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function getHRZones(age) {
  const max = 220 - age;
  return {
    max,
    fatBurnLow: Math.round(max * 0.70),
    fatBurnHigh: Math.round(max * 0.80),
    cardioLow: Math.round(max * 0.80),
    cardioHigh: Math.round(max * 0.90),
  };
}

function getDietTargets(weight, restDay) {
  const w = parseFloat(weight);
  if (!w) return null;
  const calories = Math.round(w * (restDay ? 10 : 11));
  const protein = Math.round(w * 0.9);
  const fat = Math.round(w * 0.35);
  const carbCalories = calories - (protein * 4) - (fat * 9);
  const carbs = Math.max(0, Math.round(carbCalories / 4));
  return {
    calories,
    proteinLow: Math.round(w * 0.8),
    proteinHigh: Math.round(w * 1.0),
    proteinTarget: protein,
    fatTarget: fat,
    fatLow: Math.round(w * 0.3),
    fatHigh: Math.round(w * 0.4),
    carbTarget: carbs,
    carbLow: Math.round(carbs * 0.85),
    carbHigh: Math.round(carbs * 1.15),
    // Fiber scales with calories (14g per 1000 kcal, the standard
    // recommendation), so it moves with training vs rest day automatically.
    fiberTarget: Math.round((calories / 1000) * 14),
    // Sodium is a CEILING, not a goal. 2300mg is the standard daily limit.
    // Training days get a little more room for sweat loss.
    sodiumLimit: restDay ? 2300 : 2500,
    waterOz: Math.round(w * (restDay ? 0.5 : 0.6)),
  };
}

function ToastStack({ toasts }) {
  if (!toasts.length) return null;
  return (
    <div style={{ position: "fixed", top: "16px", left: "16px", right: "16px", zIndex: 1000, display: "flex", flexDirection: "column", gap: "8px", pointerEvents: "none" }}>
      {toasts.map(t => (
        <div key={t.id} style={{
          background: "#111827", border: `1px solid ${t.color || "#38bdf8"}55`, borderRadius: "12px",
          padding: "14px 16px", boxShadow: "0 8px 24px rgba(0,0,0,0.4)", animation: "toastIn 0.25s ease-out",
        }}>
          <div style={{ color: t.color || "#38bdf8", fontSize: "14px", fontWeight: "800", marginBottom: t.subtitle ? "2px" : "0" }}>{t.title}</div>
          {t.subtitle && <div style={{ color: "#d1d5db", fontSize: "12px" }}>{t.subtitle}</div>}
        </div>
      ))}
      <style>{`@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }`}</style>
    </div>
  );
}

function XPBar({ xp }) {
  const { level, into, needed, pct } = getLevelInfo(xp);
  return (
    <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
        <div style={{ color: "#a855f7", fontSize: "10px", letterSpacing: "3px" }}>LEVEL {level}</div>
        <div style={{ color: "#6b7280", fontSize: "11px" }}>{into} / {needed} XP</div>
      </div>
      <div style={{ background: "#0d1117", borderRadius: "999px", height: "10px", overflow: "hidden" }}>
        <div style={{ background: "linear-gradient(90deg, #a855f7, #ec4899)", height: "100%", width: `${pct}%`, borderRadius: "999px", transition: "width 0.3s" }} />
      </div>
      <div style={{ color: "#4b5563", fontSize: "10px", marginTop: "6px" }}>{xp} total XP earned</div>
    </div>
  );
}

function getLevelInfo(xp) {
  const perLevel = 100;
  const level = Math.floor(xp / perLevel) + 1;
  const into = xp % perLevel;
  return { level, into, needed: perLevel, pct: Math.round((into / perLevel) * 100) };
}

// MET values for standalone cardio logging. Lifting keeps its own fixed
// 4.5 MET below - these are only used by the manual Activity Logger, since
// a 60-min walk and a 20-min run burn very differently and a flat number
// would be wrong most of the time.
const CARDIO_TYPES = [
  { key: "walk", label: "Walk", met: 3.8 },
  { key: "run", label: "Run", met: 9.0 },
  { key: "bike", label: "Bike", met: 7.0 },
  { key: "hike", label: "Hike", met: 6.0 },
  { key: "other", label: "Other", met: 5.0 },
];

function estimateCaloriesBurned(weightLbs, durationHours, met) {
  const w = parseFloat(weightLbs) || 200;
  const kg = w / 2.205;
  const MET = met || 4.5;
  const hours = durationHours || 0.83; // fallback: ~50 min average session when no real timer was used
  return Math.round((MET * kg * hours) / 10) * 10;
}

function checkMacroHits(totals, targets) {
  return {
    calories: totals.calories >= targets.calories * 0.85 && totals.calories <= targets.calories * 1.15,
    protein: totals.protein >= targets.proteinLow,
    fat: totals.fat >= targets.fatLow && totals.fat <= targets.fatHigh,
    carbs: totals.carbs >= targets.carbLow && totals.carbs <= targets.carbHigh,
    fiber: totals.fiber >= targets.fiberTarget,
    water: totals.water >= targets.waterOz * 0.9,
    // Sodium is inverted: "hit" means you stayed UNDER the ceiling. Only
    // counts once you've actually logged food, so an empty day isn't a win.
    sodium: totals.calories > 0 && totals.sodium <= targets.sodiumLimit,
  };
}

// Single source of truth for summing a day's entries. Used by both the
// Nutrition tab and the XP award logic so the two can't drift apart.
const EMPTY_TOTALS = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sodium: 0, water: 0 };
function sumEntries(entries) {
  return (entries || []).reduce((acc, e) => ({
    calories: acc.calories + (e.calories || 0),
    protein: acc.protein + (e.protein || 0),
    carbs: acc.carbs + (e.carbs || 0),
    fat: acc.fat + (e.fat || 0),
    fiber: acc.fiber + (e.fiber || 0),
    sodium: acc.sodium + (e.sodium || 0),
    water: acc.water + (e.water || 0),
  }), { ...EMPTY_TOTALS });
}

function getRateOfLoss(log) {
  if (!log || log.length < 2) return null;
  const recent = log.slice(-3);
  const first = recent[0];
  const last = recent[recent.length - 1];
  const startW = parseFloat(first.weight);
  const endW = parseFloat(last.weight);
  if (!startW || !endW) return null;

  let weeks;
  if (first.iso && last.iso) {
    const days = (new Date(last.iso) - new Date(first.iso)) / 86400000;
    weeks = days / 7;
  } else {
    weeks = recent.length - 1;
  }
  if (!weeks || weeks <= 0) return null;

  const lbsPerWeek = (startW - endW) / weeks;
  const pctPerWeek = (lbsPerWeek / endW) * 100;

  let status, color, note;
  if (pctPerWeek < 0) {
    status = "Gaining";
    color = "#f59e0b";
    note = "Weight is up over this stretch. Normal week to week. Watch the trend, not one reading.";
  } else if (pctPerWeek < 0.25) {
    status = "Slow";
    color = "#6b7280";
    note = "Below the target pace. Fine if it is intentional, otherwise tighten intake.";
  } else if (pctPerWeek <= 1.0) {
    status = "On pace";
    color = "#10b981";
    note = "This pace protects muscle while you cut. Hold it here.";
  } else if (pctPerWeek <= 1.25) {
    status = "Fast";
    color = "#f59e0b";
    note = "Slightly above target. Watch your lifts. If strength drops, eat more.";
  } else {
    status = "Too fast";
    color = "#ef4444";
    note = "Above 1.25% per week risks muscle loss on a cut. Add calories back.";
  }

  return {
    lbsPerWeek: lbsPerWeek.toFixed(1),
    pctPerWeek: pctPerWeek.toFixed(2),
    status, color, note,
    pointsUsed: recent.length,
    targetLow: (endW * 0.005).toFixed(1),
    targetHigh: (endW * 0.01).toFixed(1),
  };
}

function getWorkingWeight(max) {
  if (!max) return null;
  return Math.round((parseFloat(max) * 0.75) / 5) * 5;
}

// Monday-start week (ISO 8601), not Sunday-start. This matters specifically
// because Sunday is Flex Day, the day meant to catch up on anything missed
// Mon-Sat. A Sunday-start week boundary put Sunday in a brand new week
// bucket, so a Friday miss became invisible the moment Sunday arrived,
// the exact "resets my whole week" symptom. ISO weeks run Mon-Sun, so a
// Friday miss and its Sunday makeup now share the same week key.
function getWeekKey(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  const dayNum = (date.getDay() + 6) % 7; // Mon=0 ... Sun=6
  date.setDate(date.getDate() - dayNum + 3); // Thursday of this ISO week
  const firstThursday = new Date(date.getFullYear(), 0, 4);
  const firstDayNum = (firstThursday.getDay() + 6) % 7;
  firstThursday.setDate(firstThursday.getDate() - firstDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7 * 86400000));
  return `${date.getFullYear()}-W${week}`;
}

function getDateKey(d) {
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// The 7 dateKeys (Mon-Sun) for the ISO week containing d. Used by the
// Sunday Week Recap so "this week" always means the same Mon-Sun block
// getWeekKey groups things into.
function getWeekDates(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  const dayNum = (date.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const monday = new Date(date);
  monday.setDate(date.getDate() - dayNum);
  const result = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(monday);
    dd.setDate(monday.getDate() + i);
    result.push(getDateKey(dd));
  }
  return result;
}

// xpLog only stores {reasonKey: true}, no amount, so the weekly XP total is
// reconstructed from the fixed amount each reasonKey prefix always awards.
function xpAmountForReasonKey(key) {
  if (key.startsWith("xp_allmacros_")) return 10;
  if (key.startsWith("xp_workout_")) return 30;
  if (key.startsWith("xp_flex_")) return 15;
  if (key.startsWith("xp_cal_") || key.startsWith("xp_protein_") || key.startsWith("xp_carbs_") || key.startsWith("xp_fat_") || key.startsWith("xp_fiber_") || key.startsWith("xp_water_")) return 5;
  return 0;
}

// Real per-tier exercise names for the 5RM tab, mirrored from each lift's
// `tiers` object in the days array. Kept as a standalone lookup so
// MaxTracker doesn't need to search the days array to find them.
const tierNames = {
  bench: { beginner: "Seated Chest Press (Machine)", intermediate: "Dumbbell Bench Press", advanced: "Barbell Bench Press" },
  squat: { beginner: "Bulgarian Split Squat", intermediate: "Goblet Squat", advanced: "Barbell Back Squat" },
  ohp: { beginner: "Seated Shoulder Press (Machine)", intermediate: "Dumbbell Shoulder Press", advanced: "Barbell Overhead Press" },
  cablerow: { beginner: "Seated Cable Row (Light, Supported)", intermediate: "Seated Cable Row (Rope)", advanced: "Barbell Bent-Over Row" },
};

// Pre-v20, maxes was flat: one number per lift, always implicitly the
// Advanced/barbell variant since that was the only thing the 5RM tab
// offered. Migrates each tiered lift's old flat entry to `_advanced` so a
// real logged number never gets orphaned. Untouched if already migrated.
function migrateMaxes(maxes) {
  if (!maxes || typeof maxes !== "object") return {};
  const out = { ...maxes };
  compoundLifts.filter(l => l.tiered).forEach(({ key }) => {
    const hasTieredData = out[`${key}_beginner`] || out[`${key}_intermediate`] || out[`${key}_advanced`];
    if (out[key] && !hasTieredData) {
      out[`${key}_advanced`] = out[key];
    }
  });
  return out;
}

function MuscleTag({ muscle }) {
  const color = muscleColors[muscle] || "#666";
  return (
    <span style={{ background: color + "22", color, border: `1px solid ${color}44`, borderRadius: "4px", padding: "2px 8px", fontSize: "11px", fontWeight: "600", whiteSpace: "nowrap" }}>
      {muscle}
    </span>
  );
}

function RestTimer({ restType }) {
  const [running, setRunning] = useState(false);
  const fullSeconds = restPeriods[restType]?.seconds || 60;
  const [seconds, setSeconds] = useState(fullSeconds);
  const intervalRef = useRef(null);

  // Clear any running interval if this card collapses/unmounts mid-timer,
  // so a stray timer doesn't keep ticking in the background.
  useEffect(() => () => clearInterval(intervalRef.current), []);

  function start(e) {
    e.stopPropagation();
    setSeconds(fullSeconds);
    setRunning(true);
    intervalRef.current = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) { clearInterval(intervalRef.current); setRunning(false); return 0; }
        return s - 1;
      });
    }, 1000);
  }

  // Tapping while running cancels AND resets, so an accidental tap doesn't
  // trap you waiting it out, and it's immediately ready to start again.
  function cancel(e) {
    e.stopPropagation();
    clearInterval(intervalRef.current);
    setRunning(false);
    setSeconds(fullSeconds);
  }

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const label = restPeriods[restType]?.label || "45-60 sec";

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#0d1117", borderRadius: "8px", padding: "10px 12px", marginTop: "10px", border: "1px solid #1f2937" }}>
      <div>
        <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "1px" }}>REST BETWEEN SETS</div>
        <div style={{ color: "#9ca3af", fontSize: "13px", fontWeight: "600" }}>{running ? "Tap to cancel" : label}</div>
      </div>
      <button onClick={running ? cancel : start} style={{ background: running ? "#ef444422" : "#38bdf8", color: running ? "#ef4444" : "#030712", border: running ? "1px solid #ef444455" : "none", borderRadius: "8px", padding: "8px 14px", fontSize: "14px", fontWeight: "800", cursor: "pointer", minWidth: "70px" }}>
        {running ? `${mins}:${secs.toString().padStart(2, "0")}` : "Start"}
      </button>
    </div>
  );
}

function DifficultySelector({ exerciseKey, difficulty, onChange }) {
  const current = difficulty[exerciseKey] || "intermediate";
  const levels = [
    { key: "beginner", label: "Beginner" },
    { key: "intermediate", label: "Intermediate" },
    { key: "advanced", label: "Advanced" },
  ];
  return (
    <div style={{ display: "flex", gap: "6px", marginBottom: "10px" }}>
      {levels.map(l => (
        <button
          key={l.key}
          onClick={(e) => { e.stopPropagation(); onChange(exerciseKey, l.key); }}
          style={{
            flex: 1, padding: "6px 4px", borderRadius: "6px", fontSize: "11px", fontWeight: "700",
            border: current === l.key ? "1px solid #38bdf8" : "1px solid #374151",
            background: current === l.key ? "#38bdf822" : "transparent",
            color: current === l.key ? "#38bdf8" : "#6b7280", cursor: "pointer",
          }}
        >
          {l.label}
        </button>
      ))}
    </div>

}

function WeightLogger({ exerciseKey, weights, maxKey, maxes, history, onChange, onLog }) {
  const d = weights[exerciseKey] || { weight: "", notes: "" };
  const [localWeight, setLocalWeight] = useState(d.weight || "");
  const [localNotes, setLocalNotes] = useState(d.notes || "");
  const [saved, setSaved] = useState(false);
  const working = maxKey && maxes[maxKey] ? getWorkingWeight(maxes[maxKey].weight) : null;
  const recent = (history || []).slice(-3).reverse();

  function handleSave() {
    if (!localWeight) return;
    const entry = { weight: localWeight, notes: localNotes };
    onChange(exerciseKey, entry);
    onLog(exerciseKey, { date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }), ...entry });
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  }

  return (
    <div style={{ marginTop: "12px", padding: "12px", background: "#0d1117", borderRadius: "8px", border: "1px solid #1f2937" }}>
      <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "2px", marginBottom: "8px" }}>WEIGHT LOG</div>
      {working && (
        <div style={{ marginBottom: "8px", padding: "8px 10px", background: "#10b98115", borderRadius: "6px", border: "1px solid #10b98133" }}>
          <span style={{ color: "#6b7280", fontSize: "12px" }}>Target from your 5RM: </span>
          <span style={{ color: "#10b981", fontWeight: "800", fontSize: "14px" }}>{working} lbs</span>
        </div>
      )}
      {recent.length > 0 && (
        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", marginBottom: "8px" }}>
          {recent.map((r, i) => (
            <div key={i} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: "6px", padding: "4px 8px" }}>
              <span style={{ color: "#4b5563", fontSize: "10px" }}>{r.date}</span>
              <span style={{ color: "#9ca3af", fontSize: "11px", fontWeight: "700", marginLeft: "5px" }}>{r.weight}</span>
            </div>
          ))}
        </div>
      )}
      <input type="text" placeholder="Weight used (e.g. 135 lbs)" value={localWeight} onChange={e => setLocalWeight(e.target.value)}
        style={{ width: "100%", background: "#111827", border: "1px solid #374151", borderRadius: "6px", padding: "8px 10px", color: "#f9fafb", fontSize: "13px", outline: "none", boxSizing: "border-box", marginBottom: "8px" }} />
      <textarea placeholder="Notes (felt easy, increase next time, etc.)" value={localNotes} onChange={e => setLocalNotes(e.target.value)} rows={2}
        style={{ width: "100%", background: "#111827", border: "1px solid #374151", borderRadius: "6px", padding: "8px 10px", color: "#9ca3af", fontSize: "12px", outline: "none", resize: "none", boxSizing: "border-box", marginBottom: "8px" }} />
      <button onClick={handleSave} style={{ width: "100%", background: saved ? "#10b981" : "#1f2937", color: saved ? "#030712" : "#9ca3af", border: "none", borderRadius: "6px", padding: "10px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>
        {saved ? "Logged" : "Log this weight"}
      </button>
    </div>
  );
}

            <>

function MissedDayButton({ dayId, missed, onToggle }) {
  const weekKey = getWeekKey(new Date());
  const missedThisWeek = Object.entries(missed).filter(([k]) => k.startsWith(weekKey)).length;
  const isMissed = !!missed[`${weekKey}_d${dayId}`];
  const [showWarning, setShowWarning] = useState(false);

  function handleClick() {
    if (!isMissed && missedThisWeek >= 1) {
      setShowWarning(true);
      return;
    }
    onToggle(`${weekKey}_d${dayId}`);
  }

  function confirmAnyway() {
    onToggle(`${weekKey}_d${dayId}`);
    setShowWarning(false);
  }

  return (
    <div style={{ marginBottom: "16px" }}>
      <button onClick={handleClick} style={{
        width: "100%", background: isMissed ? "#ef444422" : "#111827",
        color: isMissed ? "#ef4444" : "#6b7280",
        border: isMissed ? "1px solid #ef444455" : "1px solid #1f2937",
        borderRadius: "10px", padding: "12px", fontSize: "13px", fontWeight: "700", cursor: "pointer",
      }}>
        {isMissed ? "✕ Marked as Missed — tap to undo" : "Mark today as missed"}
      </button>
      {showWarning && (
        <div style={{ marginTop: "10px", background: "#7c2d1233", border: "1px solid #ea580c66", borderRadius: "10px", padding: "14px" }}>
          <div style={{ color: "#fb923c", fontSize: "13px", fontWeight: "700", marginBottom: "8px" }}>
            You've already missed a day this week. Are you sure you need to miss another?
          </div>
          <div style={{ display: "flex", gap: "8px" }}>
            <button onClick={confirmAnyway} style={{ flex: 1, background: "#ea580c", color: "#fff", border: "none", borderRadius: "8px", padding: "10px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>
              Yes, mark it missed
            </button>
            <button onClick={() => setShowWarning(false)} style={{ flex: 1, background: "#111827", color: "#9ca3af", border: "1px solid #374151", borderRadius: "8px", padding: "10px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>
              Never mind
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function StartWorkoutBanner({ dayId, activeSession, onStart }) {
  const dateKey = getDateKey(new Date());
  const isActiveForThisDay = activeSession && activeSession.dateKey === dateKey && activeSession.dayId === dayId;
  const [elapsed, setElapsed] = useState(0);

  useEffect(() => {
    if (!isActiveForThisDay) return;
    const startMs = new Date(activeSession.start).getTime();
    const tick = () => setElapsed(Math.max(0, Math.floor((Date.now() - startMs) / 1000)));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [isActiveForThisDay, activeSession?.start]);

  if (!isActiveForThisDay) {
    return (
      <button onClick={onStart} style={{
        width: "100%", background: "#38bdf822", color: "#38bdf8", border: "1px solid #38bdf855",
        borderRadius: "10px", padding: "14px", fontSize: "14px", fontWeight: "700", cursor: "pointer", marginBottom: "16px",
      }}>

  }

  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  return (
    <div style={{ background: "#10b98122", border: "1px solid #10b98155", borderRadius: "10px", padding: "14px", marginBottom: "16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>

        {mins}:{String(secs).padStart(2, "0")}

  );
}

function WeightChart({ log, goalWeight }) {
  if (log.length < 2) return null;
  const w = 320, h = 120, pad = { t: 10, r: 20, b: 30, l: 40 };
  const weights = log.map(e => parseFloat(e.weight));
  const minW = Math.min(...weights, goalWeight) - 5;
  const maxW = Math.max(...weights) + 5;
  const xScale = i => pad.l + (i / (log.length - 1)) * (w - pad.l - pad.r);
  const yScale = v => pad.t + ((maxW - v) / (maxW - minW)) * (h - pad.t - pad.b);
  const points = log.map((e, i) => `${xScale(i)},${yScale(e.weight)}`).join(" ");
  const goalY = yScale(goalWeight);

  const recentStart = Math.max(0, log.length - 3);
  const trend = log.length >= 2
    ? `${xScale(recentStart)},${yScale(log[recentStart].weight)} ${xScale(log.length - 1)},${yScale(log[log.length - 1].weight)}`
    : null;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto" }}>
      <line x1={pad.l} y1={goalY} x2={w - pad.r} y2={goalY} stroke="#10b98133" strokeWidth="1" strokeDasharray="4,4" />
      <text x={w - pad.r + 2} y={goalY + 4} fill="#10b981" fontSize="9">GOAL</text>
      {trend && <polyline points={trend} fill="none" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="3,3" opacity="0.8" />}
      <polyline points={points} fill="none" stroke="#38bdf8" strokeWidth="2" strokeLinejoin="round" />
      {log.map((e, i) => <circle key={i} cx={xScale(i)} cy={yScale(e.weight)} r="3" fill="#38bdf8" />)}
      {log.map((e, i) => <text key={i} x={xScale(i)} y={h - 4} textAnchor="middle" fill="#4b5563" fontSize="8">{e.date.split(" ")[0]}</text>)}
      {[minW + 5, Math.round((minW + maxW) / 2), maxW - 5].map((v, i) => (
        <text key={i} x={pad.l - 4} y={yScale(v) + 3} textAnchor="end" fill="#4b5563" fontSize="8">{Math.round(v)}</text>
      ))}
    </svg>
  );
}

// `limit` mode inverts the meaning: the bar is a ceiling to stay under
// (sodium), so it goes red when exceeded instead of green when reached.
function NutritionBar({ label, current, target, unit, color, hit, limit }) {
  const pct = target > 0 ? Math.min(100, Math.round((current / target) * 100)) : 0;
  const over = limit && current > target;
  const fill = over ? "#ef4444" : (hit ? "#10b981" : color);
  return (
    <div style={{ marginBottom: "14px" }}>
      {/* alignItems + matched lineHeight keep the label and the value on the
          same optical baseline; without them the 11px value sat high against
          the 12px label and the whole row read as off-center. */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px", lineHeight: 1 }}>
        <div style={{ color: "#d1d5db", fontSize: "12px", fontWeight: "700", display: "flex", alignItems: "center", gap: "5px", lineHeight: 1, minWidth: 0 }}>
          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
          {hit && <span style={{ color: "#10b981", flexShrink: 0 }}>✓</span>}
          {over && <span style={{ color: "#ef4444", flexShrink: 0 }}>!</span>}
        </div>
        <div style={{ color: over ? "#ef4444" : "#6b7280", fontSize: "11px", lineHeight: 1, flexShrink: 0, marginLeft: "10px", fontVariantNumeric: "tabular-nums" }}>
          {Math.round(current)}{unit} / {Math.round(target)}{unit}
        </div>
      </div>
      <div style={{ background: "#0d1117", borderRadius: "999px", height: "8px", overflow: "hidden", width: "100%" }}>
        <div style={{ background: fill, height: "100%", width: `${pct}%`, borderRadius: "999px", transition: "width 0.3s" }} />
      </div>
    </div>
  );
}

// Recipe portion divider. Enter what went INTO the pot, then either the
// percentage you ate or your plated weight in grams, and it returns just
// your share. Built for shared family meals where your portion differs
// from what was cooked.
const BLANK_INGREDIENT = { name: "", grams: "", calories: "", protein: "", carbs: "", fat: "", fiber: "", sodium: "" };

function RecipeDivider({ onLogPortion }) {
  const [open, setOpen] = useState(false);
  const [recipeName, setRecipeName] = useState("");
  const [rows, setRows] = useState([{ ...BLANK_INGREDIENT }]);
  const [mode, setMode] = useState("percent"); // "percent" | "grams"
  const [portionPct, setPortionPct] = useState("");
  const [platedGrams, setPlatedGrams] = useState("");

  const n = v => parseFloat(v) || 0;

  const recipeTotals = rows.reduce((acc, r) => ({
    grams: acc.grams + n(r.grams),
    calories: acc.calories + n(r.calories),
    protein: acc.protein + n(r.protein),
    carbs: acc.carbs + n(r.carbs),
    fat: acc.fat + n(r.fat),
    fiber: acc.fiber + n(r.fiber),
    sodium: acc.sodium + n(r.sodium),
  }), { grams: 0, calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sodium: 0 });

  // Fraction of the whole recipe that ends up on your plate.
  let fraction = 0;
  let fractionNote = "";
  if (mode === "percent") {
    fraction = n(portionPct) / 100;
    if (fraction > 0) fractionNote = `${Math.round(fraction * 100)}% of the batch`;
  } else {
    // Cooked weight differs from raw ingredient weight (water loss, water
    // absorbed by pasta/rice), so this is an approximation. Flagged in the UI.
    if (recipeTotals.grams > 0) {
      fraction = n(platedGrams) / recipeTotals.grams;
      if (fraction > 0) fractionNote = `${n(platedGrams)}g of ${Math.round(recipeTotals.grams)}g total`;
    }
  }
  const valid = fraction > 0 && recipeTotals.calories > 0;

  const portion = {
    grams: Math.round(recipeTotals.grams * fraction),
    calories: Math.round(recipeTotals.calories * fraction),
    protein: Math.round(recipeTotals.protein * fraction),
    carbs: Math.round(recipeTotals.carbs * fraction),
    fat: Math.round(recipeTotals.fat * fraction),
    fiber: Math.round(recipeTotals.fiber * fraction),
    sodium: Math.round(recipeTotals.sodium * fraction),
  };

  function updateRow(i, field, value) {
    setRows(rs => rs.map((r, idx) => idx === i ? { ...r, [field]: value } : r));
  }
  function addRow() { setRows(rs => [...rs, { ...BLANK_INGREDIENT }]); }
  function removeRow(i) { setRows(rs => rs.length === 1 ? rs : rs.filter((_, idx) => idx !== i)); }

  function handleLog() {
    if (!valid) return;
    onLogPortion({
      name: recipeName ? `${recipeName} (my portion)` : "Recipe portion",
      grams: portion.grams || null,
      calories: portion.calories,
      protein: portion.protein,
      carbs: portion.carbs,
      fat: portion.fat,
      fiber: portion.fiber,
      sodium: portion.sodium,
      water: 0,
    });
    setRecipeName(""); setRows([{ ...BLANK_INGREDIENT }]);
    setPortionPct(""); setPlatedGrams("");
    setOpen(false);
  }

  const inputBase = { background: "#0d1117", border: "1px solid #1f2937", borderRadius: "8px", padding: "9px 10px", color: "#f9fafb", fontSize: "13px", width: "100%", boxSizing: "border-box", outline: "none" };
  const miniInput = { ...inputBase, padding: "8px 8px", fontSize: "12px" };

  return (
    <div style={{ background: "#111827", borderRadius: "12px", marginBottom: "20px", border: "1px solid #1f2937", overflow: "hidden" }}>
      <div onClick={() => setOpen(o => !o)} style={{ padding: "16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ color: "#a855f7", fontSize: "10px", letterSpacing: "3px", marginBottom: "4px" }}>RECIPE PORTION DIVIDER</div>
          <div style={{ color: "#6b7280", fontSize: "12px" }}>Cooked for the family? Get just your share.</div>
        </div>
        <div style={{ color: "#a855f7", fontSize: "20px", transform: open ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>›</div>
      </div>

      {open && (
        <div style={{ borderTop: "1px solid #a855f733", padding: "16px", background: "#0a0f1a" }}>
          <input value={recipeName} onChange={e => setRecipeName(e.target.value)} placeholder="Recipe name (e.g. Cajun pasta)" style={{ ...inputBase, marginBottom: "12px" }} />

          <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "2px", marginBottom: "8px" }}>WHAT WENT IN</div>
          {rows.map((r, i) => (
            <div key={i} style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: "10px", padding: "10px", marginBottom: "8px" }}>
              <div style={{ display: "flex", gap: "6px", marginBottom: "6px" }}>
                <input value={r.name} onChange={e => updateRow(i, "name", e.target.value)} placeholder={i === 0 ? "Ingredient (e.g. dry pasta)" : "Ingredient"} style={{ ...miniInput, flex: 2 }} />
                <input value={r.grams} onChange={e => updateRow(i, "grams", e.target.value)} type="number" inputMode="decimal" placeholder="g" style={{ ...miniInput, flex: 1 }} />
                {rows.length > 1 && (
                  <div onClick={() => removeRow(i)} style={{ color: "#ef4444", fontSize: "18px", cursor: "pointer", padding: "4px 6px", flexShrink: 0 }}>×</div>
                )}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "6px" }}>
                <input value={r.calories} onChange={e => updateRow(i, "calories", e.target.value)} type="number" inputMode="decimal" placeholder="Cal" style={miniInput} />
                <input value={r.protein} onChange={e => updateRow(i, "protein", e.target.value)} type="number" inputMode="decimal" placeholder="P (g)" style={miniInput} />
                <input value={r.carbs} onChange={e => updateRow(i, "carbs", e.target.value)} type="number" inputMode="decimal" placeholder="C (g)" style={miniInput} />
                <input value={r.fat} onChange={e => updateRow(i, "fat", e.target.value)} type="number" inputMode="decimal" placeholder="F (g)" style={miniInput} />
                <input value={r.fiber} onChange={e => updateRow(i, "fiber", e.target.value)} type="number" inputMode="decimal" placeholder="Fib (g)" style={miniInput} />
                <input value={r.sodium} onChange={e => updateRow(i, "sodium", e.target.value)} type="number" inputMode="decimal" placeholder="Na (mg)" style={miniInput} />
              </div>
            </div>
          ))}

          <button onClick={addRow} style={{ width: "100%", background: "#1f2937", color: "#9ca3af", border: "1px dashed #374151", borderRadius: "8px", padding: "10px", fontSize: "12px", fontWeight: "700", cursor: "pointer", marginBottom: "14px" }}>
            + Add ingredient
          </button>

          {recipeTotals.calories > 0 && (
            <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: "8px", padding: "10px 12px", marginBottom: "14px" }}>
              <div style={{ color: "#4b5563", fontSize: "9px", letterSpacing: "2px", marginBottom: "4px" }}>WHOLE RECIPE</div>
              <div style={{ color: "#9ca3af", fontSize: "12px" }}>
                {Math.round(recipeTotals.calories)} cal · {Math.round(recipeTotals.protein)}g P · {Math.round(recipeTotals.carbs)}g C · {Math.round(recipeTotals.fat)}g F
                {recipeTotals.grams > 0 && <span> · {Math.round(recipeTotals.grams)}g</span>}
              </div>
            </div>
          )}

          <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "2px", marginBottom: "8px" }}>YOUR PORTION</div>
          <div style={{ display: "flex", gap: "6px", marginBottom: "10px" }}>
            {[{ k: "percent", l: "By %" }, { k: "grams", l: "By plated grams" }].map(m => (
              <button key={m.k} onClick={() => setMode(m.k)} style={{
                flex: 1, background: mode === m.k ? "#a855f7" : "#1f2937", color: mode === m.k ? "#030712" : "#9ca3af",
                border: "none", borderRadius: "8px", padding: "9px", fontSize: "12px", fontWeight: "700", cursor: "pointer",
              }}>{m.l}</button>
            ))}
          </div>

          {mode === "percent" ? (
            <div style={{ marginBottom: "12px" }}>
              <input value={portionPct} onChange={e => setPortionPct(e.target.value)} type="number" inputMode="decimal" placeholder="Your share as a % (e.g. 30)" style={inputBase} />
              <div style={{ display: "flex", gap: "6px", marginTop: "8px" }}>
                {[25, 33, 50].map(p => (
                  <button key={p} onClick={() => setPortionPct(String(p))} style={{ flex: 1, background: "#1f2937", color: "#9ca3af", border: "1px solid #374151", borderRadius: "8px", padding: "7px", fontSize: "11px", fontWeight: "700", cursor: "pointer" }}>
                    {p === 25 ? "1/4" : p === 33 ? "1/3" : "1/2"}
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div style={{ marginBottom: "12px" }}>
              <input value={platedGrams} onChange={e => setPlatedGrams(e.target.value)} type="number" inputMode="decimal" placeholder="Your plated weight (g)" style={inputBase} />
              <div style={{ color: "#6b7280", fontSize: "11px", marginTop: "6px", lineHeight: 1.4 }}>
                Compares against the raw ingredient weight above. Pasta and rice absorb water while cooking, so plated grams will read heavier than raw. Use % for those.
              </div>
            </div>
          )}

          {valid && (
            <div style={{ background: "#a855f715", border: "1px solid #a855f755", borderRadius: "10px", padding: "12px", marginBottom: "12px" }}>
              <div style={{ color: "#a855f7", fontSize: "9px", letterSpacing: "2px", marginBottom: "6px" }}>YOUR MACROS · {fractionNote.toUpperCase()}</div>
              <div style={{ color: "#f9fafb", fontSize: "15px", fontWeight: "800", marginBottom: "4px" }}>{portion.calories} cal</div>
              <div style={{ color: "#9ca3af", fontSize: "12px" }}>
                {portion.protein}g protein · {portion.carbs}g carbs · {portion.fat}g fat
              </div>
              <div style={{ color: "#6b7280", fontSize: "11px", marginTop: "2px" }}>
                {portion.fiber}g fiber · {portion.sodium}mg sodium
              </div>
            </div>
          )}

          <button onClick={handleLog} disabled={!valid} style={{
            width: "100%", background: valid ? "#a855f7" : "#1f2937", color: valid ? "#030712" : "#4b5563",
            border: "none", borderRadius: "8px", padding: "12px", fontSize: "13px", fontWeight: "800",
            cursor: valid ? "pointer" : "default",
          }}>
            {valid ? "Log my portion" : "Enter ingredients and your share"}
          </button>
        </div>
      )}
    </div>
  );
}

function NutritionPage({ nutritionLog, latestWeight, onAddEntry, onDeleteEntry }) {
  const [label, setLabel] = useState("");
  const [grams, setGrams] = useState("");
  const [cal, setCal] = useState("");
  const [pro, setPro] = useState("");
  const [carb, setCarb] = useState("");
  const [fat, setFat] = useState("");
  const [fiber, setFiber] = useState("");
  const [sodium, setSodium] = useState("");
  const [water, setWater] = useState("");
  // 0 = today, -1 = yesterday, etc. Entries save/load correctly per day
  // under the hood already, this just gives you a way to look back.
  const [dayOffset, setDayOffset] = useState(0);

  const viewDate = new Date();
  viewDate.setDate(viewDate.getDate() + dayOffset);
  const dateKey = getDateKey(viewDate);
  const isRestDay = viewDate.getDay() === 0;
  const isToday = dayOffset === 0;
  const dayLabel = isToday ? "Today" : dayOffset === -1 ? "Yesterday" : viewDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  const targets = getDietTargets(latestWeight || 200, isRestDay);
  const entries = nutritionLog[dateKey] || [];

  const totals = sumEntries(entries);
  const hits = targets ? checkMacroHits(totals, targets) : {};

  function handleAdd() {
    if (!cal && !pro && !carb && !fat && !fiber && !sodium && !water) return;
    onAddEntry(dateKey, {
      name: label || "Entry",
      grams: parseFloat(grams) || null,
      calories: parseFloat(cal) || 0,
      protein: parseFloat(pro) || 0,
      carbs: parseFloat(carb) || 0,
      fat: parseFloat(fat) || 0,
      fiber: parseFloat(fiber) || 0,
      sodium: parseFloat(sodium) || 0,
      water: parseFloat(water) || 0,
    });
    setLabel(""); setGrams(""); setCal(""); setPro(""); setCarb("");
    setFat(""); setFiber(""); setSodium(""); setWater("");
  }

  if (!targets) {
    return <div style={{ padding: "20px", color: "#6b7280", fontSize: "13px" }}>Log a weight on the Progress tab first, targets are calculated from your bodyweight.</div>;
  }

  const entryInput = { background: "#0d1117", border: "1px solid #1f2937", borderRadius: "8px", padding: "10px 12px", color: "#f9fafb", fontSize: "13px", width: "100%", boxSizing: "border-box", outline: "none" };

  return (
    <div style={{ padding: "20px" }}>
      <DailyTotalsStrip totals={totals} targets={targets} />

      <div style={{ color: "#f9fafb", fontSize: "20px", fontWeight: "800", marginBottom: "10px" }}>Nutrition</div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "16px", marginBottom: isToday ? "8px" : "2px" }}>
        <div onClick={() => setDayOffset(o => o - 1)} style={{ color: "#38bdf8", fontSize: "22px", cursor: "pointer", padding: "2px 12px", lineHeight: 1 }}>‹</div>
        <div style={{ color: "#f9fafb", fontSize: "14px", fontWeight: "700", minWidth: "110px", textAlign: "center" }}>{dayLabel}</div>
        <div onClick={() => !isToday && setDayOffset(o => o + 1)} style={{ color: isToday ? "#374151" : "#38bdf8", fontSize: "22px", cursor: isToday ? "default" : "pointer", padding: "2px 12px", lineHeight: 1 }}>›</div>
      </div>
      {!isToday && (
        <div onClick={() => setDayOffset(0)} style={{ textAlign: "center", color: "#4b5563", fontSize: "11px", textDecoration: "underline", textDecorationStyle: "dotted", cursor: "pointer", marginBottom: "8px" }}>
          Jump to today
        </div>
      )}

      <div style={{ color: "#6b7280", fontSize: "13px", marginBottom: "20px", textAlign: "center" }}>
        {isRestDay ? "Rest day targets" : "Training day targets"} · based on {latestWeight} lbs
      </div>

      <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>
        <NutritionBar label="Calories" current={totals.calories} target={targets.calories} unit="" color="#f59e0b" hit={hits.calories} />
        <NutritionBar label="Protein" current={totals.protein} target={targets.proteinTarget} unit="g" color="#10b981" hit={hits.protein} />
        <NutritionBar label="Carbs" current={totals.carbs} target={targets.carbTarget} unit="g" color="#38bdf8" hit={hits.carbs} />
        <NutritionBar label="Fat" current={totals.fat} target={targets.fatTarget} unit="g" color="#f59e0b" hit={hits.fat} />
        <NutritionBar label="Fiber" current={totals.fiber} target={targets.fiberTarget} unit="g" color="#84cc16" hit={hits.fiber} />
        <NutritionBar label="Sodium" current={totals.sodium} target={targets.sodiumLimit} unit="mg" color="#f97316" hit={hits.sodium} limit />
        <NutritionBar label="Water" current={totals.water} target={targets.waterOz} unit="oz" color="#8b5cf6" hit={hits.water} />
        <div style={{ color: "#4b5563", fontSize: "11px", lineHeight: 1.4, marginTop: "2px" }}>

        </div>
      </div>

      <RecipeDivider onLogPortion={(entry) => onAddEntry(dateKey, entry)} />

      <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>

        <div style={{ display: "flex", gap: "8px", marginBottom: "8px" }}>

          <input value={cal} onChange={e => setCal(e.target.value)} type="number" inputMode="decimal" placeholder="Calories" style={entryInput} />
          <input value={pro} onChange={e => setPro(e.target.value)} type="number" inputMode="decimal" placeholder="Protein (g)" style={entryInput} />
          <input value={carb} onChange={e => setCarb(e.target.value)} type="number" inputMode="decimal" placeholder="Carbs (g)" style={entryInput} />
          <input value={fat} onChange={e => setFat(e.target.value)} type="number" inputMode="decimal" placeholder="Fat (g)" style={entryInput} />

        </div>
        <button onClick={handleAdd} style={{ width: "100%", background: "#38bdf822", color: "#38bdf8", border: "1px solid #38bdf855", borderRadius: "8px", padding: "12px", fontSize: "13px", fontWeight: "700", cursor: "pointer" }}>
          Add Entry
        </button>
      </div>

      {entries.length > 0 ? (
        <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", border: "1px solid #1f2937" }}>
          <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "3px", marginBottom: "10px" }}>{isToday ? "TODAY'S ENTRIES" : `${dayLabel.toUpperCase()}'S ENTRIES`}</div>
          {entries.map((e, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: i < entries.length - 1 ? "1px solid #1f2937" : "none" }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ color: "#d1d5db", fontSize: "13px", fontWeight: "600" }}>
                  {e.name || e.label || "Entry"}{e.grams ? <span style={{ color: "#4b5563", fontWeight: "400" }}> · {e.grams}g</span> : null}
                </div>
                <div style={{ color: "#6b7280", fontSize: "11px" }}>
                  {e.calories || 0} cal · {e.protein || 0}g P · {e.carbs || 0}g C · {e.fat || 0}g F
                </div>
                <div style={{ color: "#4b5563", fontSize: "11px" }}>
                  {e.fiber || 0}g fiber · {e.sodium || 0}mg Na{e.water ? ` · ${e.water}oz` : ""}

          ))}

      ) : !isToday ? (
        <div style={{ color: "#4b5563", fontSize: "12px", textAlign: "center", padding: "20px 0" }}>Nothing logged {dayLabel}.</div>
      ) : null}
    </div>
  );

// Standalone cardio, walks/runs/anything not tied to a lift day. Duration
// times the activity's MET value drives the calorie estimate, since a
// 60-min walk and a 20-min run burn very differently.
function ActivityLogger({ weight, onLog }) {
  const [type, setType] = useState("walk");
  const [duration, setDuration] = useState("");

  function handleLog() {
    const mins = parseFloat(duration);
    if (!mins) return;
    const activity = CARDIO_TYPES.find(c => c.key === type) || CARDIO_TYPES[0];
    const calories = estimateCaloriesBurned(weight, mins / 60, activity.met);
    onLog({
      dateKey: getDateKey(new Date()),
      type: activity.key,
      typeLabel: activity.label,
      durationMin: mins,
      calories,
      loggedAt: new Date().toISOString(),
    });
    setDuration("");
  }

  return (
    <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>
      <div style={{ color: "#38bdf8", fontSize: "10px", letterSpacing: "3px", marginBottom: "12px" }}>LOG ACTIVITY</div>
      <div style={{ display: "flex", gap: "6px", marginBottom: "10px", flexWrap: "wrap" }}>
        {CARDIO_TYPES.map(c => (
          <button key={c.key} onClick={() => setType(c.key)} style={{
            flex: "1 1 auto", minWidth: "60px", background: type === c.key ? "#38bdf8" : "#0d1117",
            color: type === c.key ? "#030712" : "#9ca3af", border: "1px solid " + (type === c.key ? "#38bdf8" : "#1f2937"),
            borderRadius: "8px", padding: "8px 10px", fontSize: "12px", fontWeight: "700", cursor: "pointer",
          }}>{c.label}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: "8px" }}>
        <input type="number" inputMode="decimal" placeholder="Duration (min)" value={duration} onChange={e => setDuration(e.target.value)}
          style={{ flex: 1, background: "#0d1117", border: "1px solid #374151", borderRadius: "8px", padding: "10px 12px", color: "#f9fafb", fontSize: "14px", outline: "none" }} />
        <button onClick={handleLog} style={{ background: "#38bdf822", color: "#38bdf8", border: "1px solid #38bdf855", borderRadius: "8px", padding: "10px 16px", fontSize: "13px", fontWeight: "800", cursor: "pointer" }}>Log</button>
      </div>
      <div style={{ color: "#6b7280", fontSize: "11px", marginTop: "8px" }}>Estimate uses your logged bodyweight. Feeds into your totals below.</div>
    </div>
  );
}

function ResultsPage({ sessionLog, activityLog, weight, onSetEffort, onLogActivity, onDeleteActivity }) {
  const liftSessions = Object.entries(sessionLog).map(([key, s]) => ({ ...s, key, kind: "lift" }));
  const cardioSessions = (activityLog || []).map((a, i) => ({ ...a, key: `activity_${i}`, activityIndex: i, kind: "cardio" }));
  const sessions = [...liftSessions, ...cardioSessions].sort((a, b) => a.dateKey.localeCompare(b.dateKey));
  const total = sessions.length;

  if (total === 0) {
    return (
      <div style={{ padding: "20px" }}>
        <div style={{ color: "#f9fafb", fontSize: "20px", fontWeight: "800", marginBottom: "8px" }}>Results</div>
        <ActivityLogger weight={weight} onLog={onLogActivity} />
        <div style={{ color: "#6b7280", fontSize: "13px" }}>Finish a full workout (all exercises checked), or log an activity above, to start building your stats here.</div>
      </div>
    );
  }

  const totalCalories = sessions.reduce((s, x) => s + (x.calories || 0), 0);
  const measured = sessions.filter(s => s.durationMin);
  const avgDuration = measured.length ? Math.round(measured.reduce((s, x) => s + x.durationMin, 0) / measured.length) : null;

  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  const thisWeek = sessions.filter(s => new Date(s.dateKey) >= weekAgo).length;

  const recent = sessions.slice(-8).reverse();
  const maxCal = Math.max(...recent.map(s => s.calories || 0), 1);
  const mostRecentLift = liftSessions.sort((a, b) => a.dateKey.localeCompare(b.dateKey)).slice(-1)[0];
  const effortOptions = [
    { key: "easy", label: "Easy", color: "#10b981" },
    { key: "moderate", label: "Moderate", color: "#f59e0b" },
    { key: "hard", label: "Hard", color: "#ef4444" },
  ];

  return (
    <div style={{ padding: "20px" }}>
      <div style={{ color: "#f9fafb", fontSize: "20px", fontWeight: "800", marginBottom: "2px" }}>Results</div>
      <div style={{ color: "#6b7280", fontSize: "13px", marginBottom: "20px" }}>Every completed workout and logged activity, tracked</div>

      {mostRecentLift && !mostRecentLift.effort && (
        <div style={{ background: "#111827", borderRadius: "12px", padding: "14px 16px", border: "1px solid #1f2937", marginBottom: "16px" }}>
          <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "3px", marginBottom: "8px" }}>HOW DID {mostRecentLift.dayTitle.toUpperCase()} FEEL?</div>
          <div style={{ display: "flex", gap: "8px" }}>
            {effortOptions.map(o => (
              <button key={o.key} onClick={() => onSetEffort(mostRecentLift.key, o.key)} style={{ flex: 1, background: "#0d1117", color: o.color, border: `1px solid ${o.color}55`, borderRadius: "8px", padding: "10px", fontSize: "12px", fontWeight: "700", cursor: "pointer" }}>
                {o.label}
              </button>
            ))}
          </div>
        </div>
      )}

      <ActivityLogger weight={weight} onLog={onLogActivity} />

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "20px" }}>
        <div style={{ background: "#111827", borderRadius: "10px", padding: "14px", border: "1px solid #1f2937" }}>
          <div style={{ color: "#38bdf8", fontSize: "22px", fontWeight: "800" }}>{total}</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Total sessions</div>
        </div>
        <div style={{ background: "#111827", borderRadius: "10px", padding: "14px", border: "1px solid #1f2937" }}>
          <div style={{ color: "#10b981", fontSize: "22px", fontWeight: "800" }}>{thisWeek}</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>This week</div>
        </div>
        <div style={{ background: "#111827", borderRadius: "10px", padding: "14px", border: "1px solid #1f2937" }}>
          <div style={{ color: "#f59e0b", fontSize: "22px", fontWeight: "800" }}>{totalCalories.toLocaleString()}</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Est. calories, all time</div>
        </div>
        <div style={{ background: "#111827", borderRadius: "10px", padding: "14px", border: "1px solid #1f2937" }}>
          <div style={{ color: "#a855f7", fontSize: "22px", fontWeight: "800" }}>{avgDuration ? `${avgDuration}m` : "—"}</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Avg duration (timed)</div>
        </div>
      </div>

      <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", border: "1px solid #1f2937" }}>
        <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "3px", marginBottom: "12px" }}>RECENT SESSIONS</div>
        {recent.map((s, i) => (
          <div key={i} style={{ marginBottom: i < recent.length - 1 ? "12px" : "0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
              <div style={{ color: "#d1d5db", fontSize: "12px", fontWeight: "600" }}>
                {s.kind === "cardio" ? `🏃 ${s.typeLabel}` : s.dayTitle} · {s.dateKey.slice(5)}
                {s.effort && <span style={{ color: effortOptions.find(o => o.key === s.effort)?.color, marginLeft: "6px", fontSize: "10px" }}>· {s.effort}</span>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <div style={{ color: "#6b7280", fontSize: "11px" }}>
                  {s.durationMin ? `${s.durationMin} min · ` : ""}{s.calories} cal
                </div>
                {s.kind === "cardio" && (
                  <div onClick={() => onDeleteActivity(s.activityIndex)} style={{ color: "#ef4444", fontSize: "16px", cursor: "pointer" }}>×</div>

              </div>
            </div>
            <div style={{ background: "#0d1117", borderRadius: "999px", height: "6px", overflow: "hidden" }}>
              <div style={{ background: s.kind === "cardio" ? "#38bdf8" : "#10b981", height: "100%", width: `${((s.calories || 0) / maxCal) * 100}%`, borderRadius: "999px" }} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Per-entry edit/delete so a bad weigh-in can be corrected in place instead
// of permanently sitting in the array and skewing the chart and the Rate of
// Loss card (which reads the last 3 raw entries, not last 3 distinct days).
function WeightHistoryList({ log, onEdit, onDelete }) {
  const [editingIndex, setEditingIndex] = useState(null);
  const [editValue, setEditValue] = useState("");

  if (!log || log.length === 0) return null;
  const reversed = log.map((e, i) => ({ ...e, index: i })).slice().reverse();

  function startEdit(entry) {
    setEditingIndex(entry.index);
    setEditValue(String(entry.weight));
  }
  function saveEdit(index) {
    onEdit(index, editValue);
    setEditingIndex(null);
  }

  return (
    <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>
      <div style={{ color: "#38bdf8", fontSize: "10px", letterSpacing: "3px", marginBottom: "12px" }}>RECENT WEIGH-INS</div>
      {reversed.slice(0, 10).map(e => (
        <div key={e.index} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #1f2937" }}>
          <div style={{ color: "#6b7280", fontSize: "12px" }}>{e.date}</div>
          {editingIndex === e.index ? (
            <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
              <input type="number" value={editValue} onChange={ev => setEditValue(ev.target.value)} autoFocus
                style={{ width: "70px", background: "#0d1117", border: "1px solid #38bdf8", borderRadius: "6px", padding: "6px 8px", color: "#f9fafb", fontSize: "13px", outline: "none" }} />
              <button onClick={() => saveEdit(e.index)} style={{ background: "#10b981", color: "#030712", border: "none", borderRadius: "6px", padding: "6px 10px", fontSize: "11px", fontWeight: "700", cursor: "pointer" }}>Save</button>
              <div onClick={() => setEditingIndex(null)} style={{ color: "#6b7280", fontSize: "12px", cursor: "pointer", padding: "4px" }}>Cancel</div>
            </div>
          ) : (
            <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
              <div style={{ color: "#f9fafb", fontSize: "14px", fontWeight: "700" }}>{e.weight} lbs</div>
              <div onClick={() => startEdit(e)} style={{ color: "#38bdf8", fontSize: "12px", cursor: "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>Edit</div>
              <div onClick={() => onDelete(e.index)} style={{ color: "#ef4444", fontSize: "18px", cursor: "pointer", padding: "0 2px" }}>×</div>
            </div>
          )}
        </div>
      ))}
      {log.length > 10 && <div style={{ color: "#4b5563", fontSize: "11px", marginTop: "8px", textAlign: "center" }}>Showing your last 10. Export My Data below for the full history.</div>}
    </div>
  );
}

function ProfilePage({ data, onUpdate }) {
  const [profile, setProfile] = useState(data.profile);
  const [newWeight, setNewWeight] = useState("");
  const [saved, setSaved] = useState(false);
  const zones = getHRZones(profile.age);
  const latest = data.weightLog[data.weightLog.length - 1];
  const startWeight = data.weightLog[0]?.weight || latest?.weight;
  const lost = startWeight ? (parseFloat(startWeight) - parseFloat(latest?.weight || 0)).toFixed(1) : 0;
  const toGo = latest ? (parseFloat(latest.weight) - parseFloat(profile.goalWeight)).toFixed(1) : 0;

  function handleSaveProfile() {
    onUpdate({ ...data, profile });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  function handleExportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `roberts-gym-data-${dateStamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleLogWeight() {
    if (!newWeight) return;
    const now = new Date();
    const label = now.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const entry = { date: label, weight: parseFloat(newWeight), iso: now.toISOString() };
    onUpdate({ ...data, weightLog: [...data.weightLog, entry] });
    setNewWeight("");
  }

  // Edit fixes the number in place instead of appending a correction as a
  // brand new point - that's what was skewing the chart and the Rate of
  // Loss card, which reads the last 3 raw array entries.
  function handleEditWeightEntry(index, newValue) {
    const v = parseFloat(newValue);
    if (!v) return;
    const updated = data.weightLog.map((e, i) => i === index ? { ...e, weight: v } : e);
    onUpdate({ ...data, weightLog: updated });
  }
  function handleDeleteWeightEntry(index) {
    onUpdate({ ...data, weightLog: data.weightLog.filter((_, i) => i !== index) });
  }

  return (
    <div style={{ padding: "20px" }}>
      <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "4px", marginBottom: "4px" }}>YOUR</div>

function MaxTracker({ maxes, onSave }) {
  const [editing, setEditing] = useState({});
  const [saved, setSaved] = useState(false);
  // Which tier is being viewed/edited per tiered lift. Defaults to
  // whichever tier has the most recent loggedAt, so reopening this tab
  // shows what you actually tested last, not a fixed default.
  const [selectedTier, setSelectedTier] = useState(() => {
    const initial = {};
    compoundLifts.filter(l => l.tiered).forEach(({ key }) => {
      const tiers = ["beginner", "intermediate", "advanced"];
      const withData = tiers.filter(t => maxes[`${key}_${t}`]);
      if (withData.length === 0) { initial[key] = "intermediate"; return; }
      initial[key] = withData.sort((a, b) => new Date(maxes[`${key}_${b}`]?.loggedAt || 0) - new Date(maxes[`${key}_${a}`]?.loggedAt || 0))[0];
    });
    return initial;
  });

  function storageKeyFor(lift) {
    return lift.tiered ? `${lift.key}_${selectedTier[lift.key] || "intermediate"}` : lift.key;
  }

  function handleSave() {
    // Only stamp a fresh date/loggedAt on lifts you actually typed a new
    // number into this time. Untouched lifts keep their real last-logged
    // date, so the Sunday "max testing due" nudge stays accurate instead
    // of resetting every time you hit Save.
    const nowLabel = new Date().toLocaleDateString("en-US", { month: "short", year: "numeric" });
    const nowIso = new Date().toISOString();
    const updated = { ...maxes };
    compoundLifts.forEach(lift => {
      const storageKey = storageKeyFor(lift);
      if (editing[storageKey] !== undefined && editing[storageKey] !== "") {
        updated[storageKey] = { weight: editing[storageKey], date: nowLabel, loggedAt: nowIso };
      }
    });
    onSave(updated);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  return (
    <div style={{ padding: "20px" }}>
      <div style={{ color: "#6b7280", fontSize: "10px", letterSpacing: "4px", marginBottom: "4px" }}>MONTHLY</div>
      <div style={{ color: "#f9fafb", fontSize: "22px", fontWeight: "800", letterSpacing: "-0.5px", marginBottom: "8px" }}>5-Rep Max Tracker</div>
      <div style={{ color: "#6b7280", fontSize: "13px", marginBottom: "20px" }}>Log your best 5-rep weight once a month. Working weight calculates at 75%. If your usual rack or station is tied up, switch tiers below, each tracks its own number.</div>

      {compoundLifts.map(lift => {
        const storageKey = storageKeyFor(lift);
        const existing = maxes[storageKey];
        const currentVal = editing[storageKey] !== undefined ? editing[storageKey] : (existing?.weight || "");
        const working = getWorkingWeight(currentVal);
        const displayName = lift.tiered ? tierNames[lift.key][selectedTier[lift.key] || "intermediate"] : lift.name;
        return (
          <div key={lift.key} style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "10px", border: "1px solid #1f2937" }}>
            {lift.tiered && (
              <div style={{ display: "flex", gap: "6px", marginBottom: "10px" }}>
                {["beginner", "intermediate", "advanced"].map(t => (
                  <button key={t} onClick={() => setSelectedTier(st => ({ ...st, [lift.key]: t }))} style={{
                    flex: 1, padding: "6px 4px", borderRadius: "6px", fontSize: "11px", fontWeight: "700",
                    border: (selectedTier[lift.key] || "intermediate") === t ? "1px solid #38bdf8" : "1px solid #374151",
                    background: (selectedTier[lift.key] || "intermediate") === t ? "#38bdf822" : "transparent",
                    color: (selectedTier[lift.key] || "intermediate") === t ? "#38bdf8" : "#6b7280", cursor: "pointer",
                  }}>
                    {t.charAt(0).toUpperCase() + t.slice(1)}
                  </button>
                ))}
              </div>
            )}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "10px" }}>
              <div>
                <div style={{ color: "#f9fafb", fontSize: "14px", fontWeight: "700" }}>{displayName}</div>
                {existing?.date && <div style={{ color: "#6b7280", fontSize: "11px", marginTop: "2px" }}>Last logged: {existing.date}</div>}
              </div>
              {working && (
                <div style={{ textAlign: "right" }}>
                  <div style={{ color: "#10b981", fontSize: "18px", fontWeight: "800" }}>{working}</div>
                  <div style={{ color: "#6b7280", fontSize: "10px" }}>working wt</div>
                </div>
              )}
            </div>
            <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
              <input type="number" placeholder={existing?.weight ? `Last: ${existing.weight} lbs` : "5-rep max (lbs)"} value={currentVal}
                onChange={e => setEditing(ed => ({ ...ed, [storageKey]: e.target.value }))}
                style={{ flex: 1, background: "#0d1117", border: "1px solid #374151", borderRadius: "8px", padding: "10px 12px", color: "#f9fafb", fontSize: "14px", outline: "none" }} />

          </div>

    </div>
  );
}

function isLiftStale(rec) {
  if (!rec) return true;
  if (!rec.loggedAt) return true; // logged before precise dates were tracked - treat as due
  const elapsedDays = (new Date() - new Date(rec.loggedAt)) / 86400000;
  return elapsedDays >= 28;
}

// Your Sunday landing spot for "how did this week actually go." Not a
// forced redirect - it just sits at the top of the page you already land
// on every Sunday, so it shows up without shoving you somewhere you
// weren't headed.
function WeekRecapCard({ data }) {
  const weekDates = getWeekDates(new Date());
  const todayKey = getDateKey(new Date());

  const completedDates = new Set(Object.values(data.sessionLog || {}).map(s => s.dateKey));
  const liftDaysDone = weekDates.filter(dk => completedDates.has(dk)).length;

  const latestWeight = data.weightLog[data.weightLog.length - 1]?.weight;
  let nutritionHitDays = 0;
  weekDates.forEach(dk => {
    if (dk > todayKey) return; // don't count days that haven't happened yet
    const entries = data.nutritionLog[dk];
    if (!entries || !entries.length) return;
    const totals = sumEntries(entries);
    const targets = getDietTargets(latestWeight || 200, new Date(dk).getDay() === 0);
    if (!targets) return;
    const hits = checkMacroHits(totals, targets);
    if (hits.calories && hits.protein) nutritionHitDays++;
  });

  const weekStart = weekDates[0], weekEnd = weekDates[6];
  const weekWeights = (data.weightLog || []).filter(e => e.iso && e.iso.slice(0, 10) >= weekStart && e.iso.slice(0, 10) <= weekEnd);
  const weightChange = weekWeights.length >= 2 ? (weekWeights[weekWeights.length - 1].weight - weekWeights[0].weight) : null;

  const xpThisWeek = Object.keys(data.xpLog || {})
    .filter(k => data.xpLog[k] && weekDates.some(dk => k.includes(dk)))
    .reduce((sum, k) => sum + xpAmountForReasonKey(k), 0);

  const tileStyle = { background: "#0d1117", borderRadius: "10px", padding: "12px", border: "1px solid #1f2937" };

  return (
    <div style={{ background: "#111827", borderRadius: "12px", padding: "16px", marginBottom: "20px", border: "1px solid #1f2937" }}>
      <div style={{ color: "#a855f7", fontSize: "10px", letterSpacing: "3px", marginBottom: "12px" }}>THIS WEEK</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
        <div style={tileStyle}>
          <div style={{ color: "#10b981", fontSize: "20px", fontWeight: "800" }}>{liftDaysDone}/6</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Lift days done</div>
        </div>
        <div style={tileStyle}>
          <div style={{ color: "#38bdf8", fontSize: "20px", fontWeight: "800" }}>{nutritionHitDays}/7</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Nutrition on target</div>
        </div>
        <div style={tileStyle}>
          <div style={{ color: weightChange == null ? "#6b7280" : weightChange <= 0 ? "#10b981" : "#f59e0b", fontSize: "20px", fontWeight: "800" }}>
            {weightChange == null ? "—" : `${weightChange > 0 ? "+" : ""}${weightChange.toFixed(1)}`}
          </div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>Weight change</div>
        </div>
        <div style={tileStyle}>
          <div style={{ color: "#a855f7", fontSize: "20px", fontWeight: "800" }}>{xpThisWeek}</div>
          <div style={{ color: "#6b7280", fontSize: "11px" }}>XP earned</div>
        </div>
      </div>
    </div>
  );
}
